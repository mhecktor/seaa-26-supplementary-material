[tool.poetry]
name = "bib-analysation"
version = "0.1.0"
description = ""
authors = ["mhecktor"]
readme = "README.md"
packages = [{ include = "src" }]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
bertopic = {extras = ["spacy"], version = "^0.17.4"}
bibtexparser = "^1.2.1"
bokeh = "^3.8.1"
colorcet = "^3.1.0"
contextgem = "0.19.4"
datamapplot = "^0.6.4"
datashader = "^0.18.2"
gensim = "^4.3.3"
holoviews = "^1.22.1"
jupyter = "^1.1.1"
kaleido = "^1.2.0"
lxml = "^5.3.1"
matplotlib = "^3.9.1"
matplotlib-venn = "^1.1.2"
nlp = "^0.4.0"
nltk = "^3.9.1"
notebook = "^7.3.3"
numpy = "1.26.4"
#openai = "^1.41.1"
openai = ">=1.41.1"
openpyxl = "^3.1.5"
pandas = "^2.2.2"
plotly = "^5.23.0"
poethepoet = "^0.26.1"
progress = "^1.6"
pydantic = "^2.5.3"
pyldavis = "3.4.1"
pypaperbot = "^1.4.1"
python-dotenv = "1.0.0"
requests = "^2.31.0"
sci-hub = "^1.0.4"
scikit-image = "^0.25.2"
scikit-learn = "^1.0.2"
seaborn = "^0.13.2"
selenium = "^4.28.1"
sentence-transformers = "^5.3.0"
shapely = "^2.1.2"
spacy = "^3.7.5"
tabulate = "^0.9.0"
#thinc-apple-ops = { version = "^0.1.5", markers = "sys_platform == 'darwin'"}
typer = "^0.24.1"
undetected-chromedriver = "^3.5.5"
#cupy-cuda12x = "^13.4.0"
wordcloud = "^1.9.4"

[tool.poetry.group.dev.dependencies]
deptry = ">=0.23.0"
jupyter = "^1.0.0"
pyright = ">=1.1.399"
ruff = ">=0.11.5"

[tool.ruff]
# https://docs.astral.sh/ruff/settings/
src = ["src"]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = [
    # way to see conflicting rules?
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "COM",   # flake8-commas
    "D",     # pydocstyle
    "DTZ",   # flake8-datetimez
    "EM",    # flake8-errmsg
    "ERA",   # flake8-eradicate
    "FA",    # flake8-future-annotations
    "FAST",  # FastAPI
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "INT",   # flake8-gettext
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "NPY",   # NumPY
    "PD",    # pandas-vet
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "YTT",   # flake8-2020 (sys.version misuse)
]
ignore = [
    # pydocstyle 'undocumented'
    "D100",
    "D101",
    "D104",
    "D105",
    "D106",
    "D107",
    "PTH123",  # builtin-open
    # stylistic rules
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "ISC001",
    "ISC002",
    "S311",    # warning about cryptographic security of random()
    "TRY003",  # restricts even inbuilt exception types
    "PLW1514", # UTF-8 is default encoding anyway
    "PGH003",  # type:ignore rule codes difficult with pyright
    "UP040",   # FastAPI does not yet support type keyword for type aliases
]

    [tool.ruff.lint.extend-per-file-ignores]   # ignore all rules in src
    "test*" = [
        "ARG001",  # mock arguments are unused
        "D103",    # test functions do not need docstring
        "S101",    # assert statements are fine in tests
        "PLR2004", # magic values in assertions are fine in tests
        "SLF001",  # private member access ok in tests
        "PLC2701", # private name import ok in tests
    ]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["src", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
# https://microsoft.github.io/pyright/#/configuration
typeCheckingMode = "basic"
ignore = []

[tool.deptry]
# https://deptry.com/usage/
known_first_party = ["src", "tests"]

[tool.deptry.per_rule_ignores]
# TODO: Prune list of deptry ignores
DEP002 = ["asyncpg", "edgital-database-models", "fastapi", "pydantic", "pydantic-settings", "sqlalchemy"]

[tool.typos]
# https://github.com/crate-ci/typos
files.extend-exclude = ["*.lcov"]

[tool.sqlfluff.core]
# https://docs.sqlfluff.com/en/stable/configuration/setting_configuration.html#configuration-files
dialect = "postgres"
templater = "placeholder"
sql_file_exts = ".sql,.sql.j2"

# [tool.sqlfluff.templater]
# unwrap_wrapped_queries = true

[tool.sqlfluff.templater.placeholder]
param_style = "colon"

[tool.commitizen]
# https://commitizen-tools.github.io/commitizen/config/
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "poetry"
major_version_zero = true
version_files = [
  "pyproject.toml:^version",
  "src/__main__.py:VERSION",
  "Dockerfile:APP_VERSION",
]

[tool.pytest.ini_options]
testpaths = "tests"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core" ]
